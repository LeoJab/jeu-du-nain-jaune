<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Nain Jaune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#2433f2; --bleu2:#1a25c4; --bleu3:#121a8f;
  --jaune:#ffd426; --jaune2:#ffb800;
  --encre:#12102b; --blanc:#fff;
  --rouge:#e8213d; --rose:#ff7ac8; --vert:#2bd47d; --peau:#ffc9a3;
  --sh:4px 4px 0 var(--encre);
  --fd:'Lilita One','Arial Rounded MT Bold','Nunito',system-ui,sans-serif;
  --cw:clamp(42px,12.5vw,74px);
  --ch:calc(var(--cw)*1.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bleu);
  background-image:radial-gradient(rgba(255,255,255,.09) 1.6px,transparent 1.7px);
  background-size:22px 22px;
  color:var(--encre);font-family:'Nunito',system-ui,sans-serif;font-weight:800;
  user-select:none;-webkit-user-select:none;
}
h1,h2,h3,.disp{font-family:var(--fd);font-weight:400;letter-spacing:.01em;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jaune);outline-offset:3px}
#app{position:relative;width:100%;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.btn{
  font-weight:900;font-size:16px;border:3px solid var(--encre);border-radius:14px;
  background:var(--jaune);box-shadow:var(--sh);padding:12px 18px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;color:var(--encre);line-height:1.1;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--encre)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--encre)}
.btn.w{background:#fff}.btn.p{background:var(--rose)}.btn.g{background:var(--vert)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px;box-shadow:3px 3px 0 var(--encre)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ico{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px;border-radius:12px;box-shadow:3px 3px 0 var(--encre)}
.panel{background:#fff;border:3px solid var(--encre);border-radius:20px;box-shadow:6px 6px 0 var(--encre);padding:18px}
input,select{
  font:inherit;font-weight:900;border:3px solid var(--encre);border-radius:12px;padding:10px 12px;
  background:#fff;color:var(--encre);min-width:0;user-select:text;-webkit-user-select:text
}
.muted{opacity:.7;font-weight:700}

/* ---------- MENU ---------- */
#scr-menu{align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.menu-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.logo{position:relative;display:flex;flex-direction:column;align-items:center}
.logo .dwarf{width:118px;height:140px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(5px 5px 0 var(--encre))}
.logo h1{font-size:clamp(46px,14vw,74px);line-height:.88;text-align:center;color:var(--jaune);
  -webkit-text-stroke:3px var(--encre);paint-order:stroke fill;text-shadow:5px 5px 0 var(--encre);transform:rotate(-3deg);margin-top:-4px}
.logo p{margin:10px 0 0;color:#fff;font-weight:800;text-align:center;font-size:15px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.menu-box{width:100%;display:flex;flex-direction:column;gap:12px}
.menu-box .btn{width:100%;font-size:18px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.row > input{flex:1;min-width:0;width:100%}
.menu-box .row .btn{width:auto;flex:none;padding:14px 18px}
#code{font-size:22px;letter-spacing:.3em;text-align:center;padding:10px 6px}
#code::placeholder{letter-spacing:normal;font-size:16px}
.hint{color:#fff;font-size:13px;text-align:center;font-weight:700;opacity:.85;max-width:36ch}
.menu-foot{display:flex;gap:10px;justify-content:center}

/* ---------- LOBBY / SETUP ---------- */
#scr-lobby,#scr-setup{align-items:center;padding:16px;overflow-y:auto}
.lob{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;margin:auto}
.codebox{text-align:center;color:#fff}
.codebox .code{font-family:var(--fd);font-size:clamp(54px,17vw,84px);letter-spacing:.12em;color:var(--jaune);
  -webkit-text-stroke:3px var(--encre);paint-order:stroke fill;text-shadow:5px 5px 0 var(--encre);line-height:1}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;border:3px solid var(--encre);border-radius:14px;background:#fff8d6}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow input{flex:1;padding:7px 9px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;border:2px solid var(--encre);background:var(--jaune)}
.tag.bot{background:#c9d0ff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:13px}

/* ---------- AVATARS ---------- */
.av{width:38px;height:38px;border-radius:50%;border:3px solid var(--encre);background:var(--jaune);
  display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--fd);font-size:17px;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.bot{background:#c9d0ff;font-size:19px}

/* ---------- GAME ---------- */
#scr-game{display:none}
#scr-game.on{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;color:#fff}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.top .ttl b{font-family:var(--fd);font-weight:400;font-size:20px;color:var(--jaune);-webkit-text-stroke:1.5px var(--encre);paint-order:stroke fill;text-shadow:2px 2px 0 var(--encre)}
.top .ttl span{font-size:12px;opacity:.85}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 7px;padding:4px 8px}
.opp{position:relative;display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--encre);
  border-radius:14px;padding:3px 9px 3px 3px;box-shadow:3px 3px 0 var(--encre);min-width:0;max-width:170px;transition:transform .2s,background .2s}
.opp .info{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.opp .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.opp .st{font-size:12px;font-weight:800;white-space:nowrap}
.opp.turn{background:var(--jaune);transform:translateY(-3px) scale(1.04);animation:turnglow 1s ease-in-out infinite}
.opp.away{opacity:.55}
.opp .crd{display:inline-block;width:10px;height:13px;border:2px solid var(--encre);border-radius:3px;background:var(--bleu);vertical-align:-2px;margin-right:2px}
@keyframes turnglow{0%,100%{box-shadow:3px 3px 0 var(--encre),0 0 0 0 rgba(255,212,38,.0)}50%{box-shadow:3px 3px 0 var(--encre),0 0 0 6px rgba(255,212,38,.45)}}
.bubble{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#fff;border:3px solid var(--encre);
  border-radius:12px;padding:3px 9px;font-size:13px;white-space:nowrap;box-shadow:2px 2px 0 var(--encre);z-index:20;animation:bub 1.6s forwards;pointer-events:none}
.bubble::after{content:'';position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--encre)}
.opps .bubble{bottom:auto;top:calc(100% + 7px)}
.opps .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--encre)}
@keyframes bub{0%{opacity:0;transform:translateX(-50%) scale(.5)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

.table{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:4px 10px}

/* board */
.board{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  width:min(100%,460px);padding:8px;border:3px solid var(--encre);border-radius:22px;background:var(--bleu3);
  box-shadow:5px 5px 0 var(--encre);
}
.case{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;
  background:#fff;border:3px solid var(--encre);border-radius:14px;min-width:0;transition:transform .2s}
.case .mini{font-family:var(--fd);font-size:16px;line-height:1;display:flex;align-items:center;gap:1px}
.case .mini.red{color:var(--rouge)}
.case .lbl{font-size:10px;font-weight:800;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.case .pot{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:900}
.coin-i{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--jaune);border:2px solid var(--encre);box-shadow:inset -2px -2px 0 var(--jaune2)}
.stack{display:flex;flex-direction:column-reverse;align-items:center;height:22px;justify-content:flex-start}
.stack i{display:block;width:22px;height:5px;border-radius:50%;background:var(--jaune);border:1.5px solid var(--encre);margin-top:-2px}
.case.nain{background:var(--jaune);grid-column:3;grid-row:1;border-radius:18px;transform:scale(1.08);z-index:2}
.case.nain .dwarf{width:34px;height:40px}
.case.flash{animation:caseflash .7s}
@keyframes caseflash{0%,100%{transform:scale(1)}30%{transform:scale(1.25) rotate(-4deg);background:var(--vert)}}
.case.nain.flash{animation:nainflash 1.2s}
@keyframes nainflash{0%,100%{transform:scale(1.08)}20%{transform:scale(1.5) rotate(-8deg)}40%{transform:scale(1.3) rotate(8deg)}60%{transform:scale(1.4) rotate(-5deg)}}
.case[data-k=dix]{grid-column:1;grid-row:1}
.case[data-k=valet]{grid-column:2;grid-row:1}
.case[data-k=dame]{grid-column:4;grid-row:1}
.case[data-k=roi]{grid-column:5;grid-row:1}

/* tapis / suite */
.tapis{position:relative;width:min(100%,460px);height:calc(var(--ch) + 70px);padding-top:4px;border:3px dashed rgba(255,255,255,.45);border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(18,26,143,.35)}
.need{font-size:14px;background:var(--encre);color:#fff;padding:4px 12px;border-radius:99px;white-space:nowrap}
.need b{color:var(--jaune)}
.need.free{background:var(--vert);color:var(--encre);border:2px solid var(--encre)}
.need.free b{color:var(--encre)}
.seq{display:flex;align-items:center;justify-content:center;height:var(--ch);margin-top:8px}
.seq .card{margin-left:calc(var(--cw)*-.55);box-shadow:2px 2px 0 var(--encre)}
.seq .card:first-child{margin-left:0}
.seq .card.last{transform:rotate(var(--rot,0deg)) scale(1.06);box-shadow:4px 4px 0 var(--encre);z-index:3}
.seq .empty{color:rgba(255,255,255,.7);font-size:14px;text-align:center;padding:0 10px}
.talon{position:absolute;right:12px;top:6px;font-size:11px;color:rgba(255,255,255,.75)}
.need{position:relative;z-index:4}

.status{text-align:center;padding:4px 10px 6px;min-height:34px}
.status span{display:inline-block;background:#fff;border:3px solid var(--encre);border-radius:99px;padding:4px 14px;font-size:14px;box-shadow:3px 3px 0 var(--encre);max-width:100%}
.status span.me{background:var(--jaune);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* me */
.mezone{background:rgba(18,16,43,.35);border-top:3px solid var(--encre);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.mebar{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:relative}
.mechip{position:relative;display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--encre);border-radius:14px;padding:3px 10px 3px 3px;box-shadow:3px 3px 0 var(--encre);min-width:0}
.mechip.turn{background:var(--jaune)}
.mechip .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.mechip .tk{font-size:14px}
.reacts{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap;overflow:hidden}
.reacts button{width:34px;height:34px;border-radius:10px;border:2px solid var(--encre);background:#fff;cursor:pointer;font-size:17px;padding:0;flex:none}
.reacts button:active{transform:scale(.9)}
.hand{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 12px);padding-top:12px}
.hand .card{transition:transform .15s,filter .15s,margin .2s}
.hand .card.ok{cursor:pointer;transform:translateY(-10px);box-shadow:3px 3px 0 var(--encre),0 0 0 4px var(--jaune)}
.hand .card.ok:hover{transform:translateY(-16px) rotate(-2deg)}
.hand.myturn .card:not(.ok){filter:brightness(.7) saturate(.6)}
.hand .msg{color:#fff;font-size:15px;align-self:center;text-align:center}

/* cards */
.card{position:relative;flex:none;width:var(--cw);height:var(--ch);background:#fff;border:2.5px solid var(--encre);border-radius:calc(var(--cw)*.13);
  box-shadow:2px 2px 0 var(--encre);color:var(--encre);font-family:var(--fd);line-height:1}
.card.red{color:var(--rouge)}
.card .tl{position:absolute;left:5%;top:4%;font-size:calc(var(--cw)*.27);text-align:center;line-height:.95}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.55)}
.card .mid b{font-weight:400;font-size:calc(var(--cw)*.5);display:block;text-align:center}
.card .mid small{display:block;font-size:calc(var(--cw)*.3);text-align:center}
.card.hon{background:linear-gradient(160deg,#fff 55%,#fff1b0)}
.card.hon::after{content:'★';position:absolute;right:5%;bottom:3%;font-size:calc(var(--cw)*.26);color:var(--jaune2);-webkit-text-stroke:1px var(--encre)}
.card.nainc{background:var(--jaune)}
.card.back{background:var(--bleu);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 4px,transparent 4px 9px)}
.card.back::before{content:'';position:absolute;inset:14%;border:2px solid rgba(255,255,255,.6);border-radius:6px}
.card.fly{position:fixed;left:0;top:0;z-index:60;margin:0;pointer-events:none;transition:transform .42s cubic-bezier(.3,1.3,.5,1)}
.card.land{animation:land .3s ease-out}
@keyframes land{0%{transform:scale(1.4) rotate(var(--rot,0deg))}100%{transform:rotate(var(--rot,0deg)) scale(1.06)}}
.hidden{visibility:hidden}

/* fx overlay */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:85;text-align:center;padding:16px}
.bn{font-family:var(--fd);color:var(--jaune);-webkit-text-stroke:3px var(--encre);paint-order:stroke fill;text-shadow:6px 6px 0 var(--encre);
  font-size:clamp(40px,12vw,96px);line-height:.95;animation:bnpop 1.9s cubic-bezier(.2,1.4,.4,1) forwards}
.bn small{display:block;font-size:.36em;color:#fff;-webkit-text-stroke:2px var(--encre);text-shadow:3px 3px 0 var(--encre);margin-top:.25em}
.bn.big{font-size:clamp(48px,15vw,128px)}
.bn.red{color:var(--rose)}
.bn.green{color:var(--vert)}
@keyframes bnpop{0%{transform:scale(.2) rotate(-12deg);opacity:0}15%{transform:scale(1.12) rotate(3deg);opacity:1}25%{transform:scale(1) rotate(-2deg)}80%{transform:scale(1) rotate(-2deg);opacity:1}100%{transform:scale(1.4) rotate(0);opacity:0}}
.stamp{font-family:var(--fd);font-size:clamp(34px,10vw,70px);color:var(--rouge);border:6px solid var(--rouge);border-radius:16px;padding:4px 18px;
  background:rgba(255,255,255,.92);animation:stamp 1.5s forwards;text-shadow:none}
.stamp small{display:block;font-size:.34em;color:var(--encre)}
@keyframes stamp{0%{transform:scale(3) rotate(-14deg);opacity:0}18%{transform:scale(.95) rotate(-8deg);opacity:1}24%{transform:scale(1) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
.nainshow{display:flex;flex-direction:column;align-items:center;animation:nainin 2.6s forwards}
.nainshow .dwarf{width:min(46vw,230px);height:auto;filter:drop-shadow(8px 8px 0 var(--encre));animation:dance .35s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-14px)}}
@keyframes nainin{0%{transform:translateY(100vh) scale(.4)}18%{transform:translateY(-4vh) scale(1.1)}26%{transform:translateY(0) scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
#flashlayer{position:fixed;inset:0;pointer-events:none;z-index:79;opacity:0}
#flashlayer.go{animation:flash .6s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#dim{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgba(18,16,43,.2),rgba(18,16,43,.95) 70%);opacity:0;pointer-events:none;z-index:78;transition:opacity .5s}
#dim.on{opacity:1}
.opera{font-family:var(--fd);font-size:clamp(46px,14vw,120px);line-height:.9;color:var(--jaune);-webkit-text-stroke:3px var(--encre);paint-order:stroke fill;
  text-shadow:0 0 30px rgba(255,212,38,.8),6px 6px 0 var(--encre)}
.opera span{display:inline-block;animation:letter .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{from{transform:translateY(-60px) scale(2);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-8px,4px) rotate(-1deg)}30%{transform:translate(7px,-5px) rotate(1deg)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}80%{transform:translate(-2px,2px)}}
.coin{position:fixed;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--jaune);border:2.5px solid var(--encre);box-shadow:inset -3px -3px 0 var(--jaune2);
  z-index:70;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.4,.5,1),opacity .2s}
.floattxt{position:fixed;z-index:75;pointer-events:none;font-family:var(--fd);font-size:26px;color:var(--jaune);-webkit-text-stroke:2px var(--encre);paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--encre);animation:floatup 1.4s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.floattxt.red{color:var(--rose)}
@keyframes floatup{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;scale:1.2}30%{scale:1}100%{opacity:0;margin-top:-60px}}
.emo{position:fixed;z-index:76;pointer-events:none;font-size:34px;animation:emo 1.8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes emo{0%{opacity:0;scale:.3}15%{opacity:1;scale:1.4}30%{scale:1}100%{opacity:0;margin-top:-90px;rotate:20deg}}
.combo{font-family:var(--fd);position:fixed;z-index:77;pointer-events:none;color:var(--rose);-webkit-text-stroke:2.5px var(--encre);paint-order:stroke fill;
  text-shadow:4px 4px 0 var(--encre);font-size:40px;transform:translate(-50%,-50%) rotate(-8deg);animation:combo 1.1s ease-out forwards;white-space:nowrap}
@keyframes combo{0%{opacity:0;scale:2.4}20%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0;scale:1.3}}

/* modal */
#modal{position:fixed;inset:0;background:rgba(18,16,43,.62);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
#modal.on{display:flex}
#modal .panel{width:100%;max-width:470px;max-height:calc(100dvh - 32px);overflow-y:auto;animation:modalin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes modalin{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
#modal h2{font-size:28px;margin-bottom:8px}
#modal p{margin:6px 0;font-weight:700;line-height:1.45}
#modal ul{padding-left:20px;margin:6px 0;font-weight:700;line-height:1.45}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mbtns .btn{flex:1;min-width:130px}
.rtab{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.rtab td{padding:6px 4px;border-top:2px solid #eee;vertical-align:middle}
.rtab td.n{text-align:right;white-space:nowrap}
.rtab .who{display:flex;align-items:center;gap:7px}
.rtab .who .av{width:30px;height:30px;font-size:14px}
.minis{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.minis span{font-family:var(--fd);font-size:12px;background:#f2f2f2;border-radius:4px;padding:1px 3px}
.minis span.r{color:var(--rouge)}

<script>
'use strict';
/* =========================================================
   LE NAIN JAUNE — ChadGangGames
   ========================================================= */
const $ = s => document.querySelector(s);
const SDK = window.ChadGang || null;
const LS = {
  get(k, d) { try { const v = localStorage.getItem('nj_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nj_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('nj_' + k); } catch (e) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DWARF = '<svg class="dwarf" viewBox="0 0 100 120" aria-hidden="true"><use href="#dwarf"/></svg>';

/* ---------------- CARTES ---------------- */
const SUIT = ['♠', '♥', '♦', '♣'], RED = [0, 1, 1, 0];
const rk = c => c % 13 + 1, su = c => (c / 13) | 0;
const RN = r => r === 1 ? 'A' : r === 11 ? 'V' : r === 12 ? 'D' : r === 13 ? 'R' : String(r);
const RL = r => r === 1 ? 'As' : r === 11 ? 'Valet' : r === 12 ? 'Dame' : r === 13 ? 'Roi' : String(r);
const UN = r => (r === 12 ? 'une ' : r === 1 || r === 8 ? 'un ' : 'un ') + RL(r);
const cname = c => RN(rk(c)) + SUIT[su(c)];
const cval = c => Math.min(10, rk(c));
const CASES = [
  { k: 'dix',   c: 35, m: 1, nom: 'Dix de carreau' },
  { k: 'valet', c: 49, m: 2, nom: 'Valet de trèfle' },
  { k: 'nain',  c: 32, m: 5, nom: 'Nain jaune' },
  { k: 'dame',  c: 11, m: 3, nom: 'Dame de pique' },
  { k: 'roi',   c: 25, m: 4, nom: 'Roi de cœur' }
];
const CASE_OF = {}; CASES.forEach(x => CASE_OF[x.c] = x);
const CASE_K = {}; CASES.forEach(x => CASE_K[x.k] = x);
const DEAL = { 3: 15, 4: 12, 5: 9, 6: 8, 7: 7, 8: 6 };
const BOTNAMES = ['Gérard', 'Josiane', 'Bernadette', 'Le Comte', 'Tatie Danielle', 'Jean-Mi', 'Mamie Lulu', 'Roger'];
const BOTEMO = ['🤖', '👵', '🧔', '🎩', '👒', '🧢', '🧶', '🥖'];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- MOTEUR DE RÈGLES ---------------- */
function newState(players, opts) {
  return {
    v: Date.now(), phase: 'lobby', gid: '', code: opts.code || '', rounds: opts.rounds || 5, start: opts.start || 100,
    round: 0, players, hands: [], talon: 0, pots: { dix: 0, valet: 0, nain: 0, dame: 0, roi: 0 },
    turn: 0, need: 0, lastBy: 0, seq: [], dealer: -1, streak: [], dealt: 0, log: [], ev: [], evn: 0, res: null, fin: null
  };
}
function ev(S, o) { S.evn++; o.n = S.evn; S.ev.push(o); if (S.ev.length > 16) S.ev.shift(); }
function logp(S, t) { S.log.push(t); if (S.log.length > 22) S.log.shift(); }
const pn = (S, i) => S.players[i] ? S.players[i].name : '?';

function startGame(S) {
  S.gid = ((S.code || 'LOCAL') + '-' + Date.now().toString(36)).slice(0, 60);
  S.round = 0; S.res = null; S.fin = null; S.log = [];
  S.players.forEach(p => p.tokens = S.start);
  S.pots = { dix: 0, valet: 0, nain: 0, dame: 0, roi: 0 };
  S.dealer = Math.floor(Math.random() * S.players.length) - 1;
  startRound(S);
}
function startRound(S) {
  const n = S.players.length;
  S.round++; S.dealer = (S.dealer + 1 + n) % n;
  S.players.forEach(p => CASES.forEach(cs => { const a = Math.min(cs.m, p.tokens); p.tokens -= a; S.pots[cs.k] += a; }));
  const deck = shuffle([...Array(52).keys()]); const per = DEAL[n];
  S.hands = S.players.map((_, i) => deck.slice(i * per, (i + 1) * per));
  S.talon = 52 - n * per; S.dealt = per;
  S.turn = (S.dealer + 1) % n; S.need = 0; S.lastBy = S.turn; S.seq = [];
  S.streak = S.players.map(() => 0); S.res = null; S.phase = 'play';
  logp(S, `🎴 Manche ${S.round}/${S.rounds} : chacun mise 15 jetons, ${per} cartes par joueur.`);
  ev(S, { k: 'round' });
}
function playableOf(S, i) { const h = S.hands[i] || []; return S.need ? h.filter(c => rk(c) === S.need) : h.slice(); }
function doPlay(S, i, c) {
  if (S.phase !== 'play' || S.turn !== i) return false;
  const h = S.hands[i], ix = h.indexOf(c);
  if (ix < 0 || (S.need && rk(c) !== S.need)) return false;
  h.splice(ix, 1); S.seq.push(c); if (S.seq.length > 12) S.seq.shift();
  S.streak = S.streak.map((s, j) => j === i ? s + 1 : 0);
  S.lastBy = i;
  const p = S.players[i], e = { k: 'play', p: i, c, st: S.streak[i] }, cs = CASE_OF[c];
  if (cs) {
    const amt = S.pots[cs.k]; p.tokens += amt; S.pots[cs.k] = 0; e.cs = cs.k; e.amt = amt;
    logp(S, `${cs.k === 'nain' ? '🧙' : '💰'} ${p.name} pose le ${cs.nom} et rafle ${amt} jetons !`);
  }
  ev(S, e);
  if (!h.length) { endRound(S, i); return true; }
  if (rk(c) === 13) { S.need = 0; ev(S, { k: 'king', p: i }); }
  else S.need = rk(c) + 1;
  return true;
}
function doPass(S) {
  const n = S.players.length, i = S.turn, nx = (i + 1) % n;
  ev(S, { k: 'pass', p: i, need: S.need });
  if (nx === S.lastBy) {
    ev(S, { k: 'block', p: nx, need: S.need });
    logp(S, `🚧 Personne n'a de ${RL(S.need)}. ${pn(S, nx)} repart avec la carte de son choix.`);
    S.need = 0;
  }
  S.turn = nx;
  return true;
}
// résout d'un coup toutes les passes automatiques (personne n'attend une minuterie)
function settle(S) { let g = 0; while (S.phase === 'play' && !playableOf(S, S.turn).length && g++ < 20) doPass(S); }
function endRound(S, w) {
  const opera = S.streak[w] >= S.dealt;
  const rows = []; let gain = 0;
  S.players.forEach((p, j) => {
    if (j === w) return;
    const h = S.hands[j];
    const due = h.reduce((a, c) => a + cval(c), 0);
    const pay = Math.min(due, p.tokens); p.tokens -= pay; gain += pay;
    let pen = 0;
    h.forEach(c => { const cs = CASE_OF[c]; if (cs) { const a = Math.min(cs.m * 2, p.tokens); p.tokens -= a; S.pots[cs.k] += a; pen += a; } });
    rows.push({ p: j, cards: h.slice(), pay, pen });
  });
  let og = 0;
  if (opera) CASES.forEach(cs => { og += S.pots[cs.k]; S.pots[cs.k] = 0; });
  S.players[w].tokens += gain + og;
  S.res = { w, rows, gain, opera, og };
  S.need = 0;
  if (opera) logp(S, `🎭 GRAND OPÉRA de ${pn(S, w)} ! Il vide tout le plateau (+${og}) et touche ${gain} jetons.`);
  else logp(S, `🏆 ${pn(S, w)} n'a plus de cartes et empoche ${gain} jetons.`);
  ev(S, { k: opera ? 'opera' : 'win', p: w, gain, og });
  const ruined = S.players.filter(p => p.tokens <= 0).map(p => p.name);
  if (S.round >= S.rounds || ruined.length) {
    S.phase = 'over';
    const max = Math.max(...S.players.map(p => p.tokens));
    S.fin = { win: S.players.map((p, i) => p.tokens === max ? i : -1).filter(i => i >= 0), ruined };
    ev(S, { k: 'over' });
  } else S.phase = 'roundEnd';
}
function botPick(S, i) {
  const pl = playableOf(S, i); if (!pl.length) return null;
  if (S.need) return pl.find(c => CASE_OF[c]) ?? pl[0];
  const h = S.hands[i], ranks = new Set(h.map(rk));
  let best = pl[0], bs = -1e9;
  for (const c of h) {
    let r = rk(c), len = 0, hon = 0;
    while (r <= 13 && ranks.has(r)) { len++; hon += h.filter(x => rk(x) === r && CASE_OF[x]).length; r++; }
    const s = len * 10 + hon * 9 + (CASE_OF[c] ? 6 : 0) + cval(c) * .6 + ((c * 7919 + S.round * 31 + S.seq.length * 17) % 29) / 10;
    if (s > bs) { bs = s; best = c; }
  }
  return best;
}

/* ---------------- SON (WebAudio synthé) ---------------- */
const SND = {
  ctx: null, on: LS.get('snd', true),
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  t(f, d = .15, type = 'sine', v = .12, w = 0, f2) {
    if (!this.on || !this.ctx) return;
    const t0 = this.ctx.currentTime + w, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.0008, t0 + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + d + .05);
  },
  noise(d = .06, v = .2, w = 0, hp = 1800) {

/* ---- hôte : boucle automatique (passes, bots, absents) ---- */
function hostTick() {
  clearTimeout(hostTimer);

  const v = S.v;
  if (!amHost()) {
    // relais : si l'hôte dort (onglet en arrière-plan), un autre joueur fait jouer les bots.
    // Le coup d'un bot est déterministe, donc tout le monde calcule le même état.
    if (mode === 'online' && S.phase === 'play' && S.players[S.turn].bot && playableOf(S, S.turn).length) {
      const backup = 2500 + Math.max(0, S.players.filter(p => !p.bot).findIndex(p => p.id === myId)) * 1200;
      hostTimer = setTimeout(() => { if (S.v !== v) return; const i = S.turn, c = botPick(S, i); mutate(s => doPlay(s, i, c)); }, backup);
    }
    return;
  }
  if (S.phase === 'play') {
    const i = S.turn, p = S.players[i], pl = playableOf(S, i);
    if (!pl.length) { hostTimer = setTimeout(() => { if (S.v === v) mutate(s => doPass(s)); }, 620); return; }
    const absent = !present(p);
    if (p.bot || absent) {

    } else if (mode === 'online') {

function bindOpts(root, cb) {

  if (!r) return;
  const f = () => { LS.set('rounds', +r.value); LS.set('start', +s.value); cb(+r.value, +s.value); };
  r.onchange = f; s.onchange = f;
}

/* ---- en ligne ---- */
async function joinRoom(code, create) {
  if (!SDK) return;
  try { const m = await SDK.me(); if (m) { me.name = m.name || me.name; me.avatar = m.avatar || null; me.id = m.id; } } catch (e) {}
  if (room) try { room.leave(); } catch (e) {}
  mode = 'online'; roomCode = code; S = null; roomPlayers = []; hellos = {}; lastEvN = 0; LS.set('lastRoom', code);
  render();
  room = SDK.join(code, { create });
  room.on('ready', info => {
    myId = info.me; roomPlayers = info.players || [];
    if (info.last && info.last.t === 'state' && info.last.s) applyState(info.last.s, true);
    room.send({ t: 'hello', name: me.name, avatar: me.avatar });
    syncLobby(); render();
  });
  room.on('players', list => { roomPlayers = list || []; syncLobby(); render(); hostTick(); });
  room.on('message', (d, from) => {
    if (!d || !from) return;
    if (d.t === 'state' && d.s) { if (!S || d.s.v > S.v) applyState(d.s, !S); }
    else if (d.t === 'act') { if (amHost() && from.id !== myId) hostAct(d, S ? S.players.findIndex(p => p.id === from.id) : -1, false); }
    else if (d.t === 'hello') { hellos[from.id] = { avatar: d.avatar || null }; syncLobby(); }
    else if (d.t === 'emo') { if (from.id !== myId) showEmo(from.id, d.e); }
  });
  room.on('error', msg => { toast(typeof msg === 'string' ? msg : 'Impossible de rejoindre cette salle.'); leaveOnline(); });
}
function leaveOnline() { try { room && room.leave(); } catch (e) {} room = null; mode = null; S = null; clearTimeout(hostTimer); closeModal(); render(); }
function syncLobby() {
  if (mode !== 'online' || !amHost() || !myId) return;
  if (S && S.phase !== 'lobby') return;
  const prevP = S ? S.players : [];
  const humans = roomPlayers.slice(0, 8).map(r => {
    const old = prevP.find(p => p.id === r.id);
    const av = (hellos[r.id] && hellos[r.id].avatar) || (old && old.avatar) || (r.id === myId ? me.avatar : null);
    return { id: r.id, name: r.name || (old && old.name) || 'Joueur', avatar: av || null, bot: false, tokens: 0 };
  });
  const bots = prevP.filter(p => p.bot).slice(0, Math.max(0, 8 - humans.length));
  const players = humans.concat(bots);
  if (!S) { const s = newState(players, { code: roomCode, rounds: LS.get('rounds', 5), start: LS.get('start', 100) }); S = null; commit(s); return; }
  if (JSON.stringify(players) !== JSON.stringify(S.players)) mutate(s => { s.players = players; });
}

    <div class="hint" style="margin:4px auto 0">Utilise « Inviter » ou « 📣 Annoncer ma partie » dans la barre du hub, ou dicte le code à tes potes.</div></div>
    <div class="panel"><h3 class="disp" style="font-size:22px;margin-bottom:8px">Autour de la table (${pl.length}/8)</h3><div class="plist">`;
  pl.forEach((p, i) => {

      ${i === 0 && !p.bot ? '<span class="tag">hôte</span>' : ''}${p.bot ? `<span class="tag bot">bot</span>${host ? `<button class="btn w sm" data-rmb="${esc(p.id)}" aria-label="Retirer le bot">✕</button>` : ''}` : ''}</div>`;
  });
  if (!pl.length) h += `<p class="muted">Connexion à la salle…</p>`;
  h += `</div>`;
  if (host && S) {
    h += `<div class="row" style="margin-top:10px"><button class="btn w sm" id="lAddB" ${pl.length >= 8 ? 'disabled' : ''}>+ Ajouter un bot</button></div>

  } else if (S) {
    h += `<p class="muted" style="margin:12px 0 0">${S.rounds} manches, ${S.start} jetons chacun. L'hôte lance la partie dès que tout le monde est là.</p>`;
  }
  h += `</div><div class="row"><button class="btn w" id="lQuit">← Quitter</button>`;
  if (host && S) {
    const miss = Math.max(0, 3 - pl.length);
    h += `<button class="btn g" id="lGo" style="flex:1">${miss ? `Compléter avec ${miss} bot${miss > 1 ? 's' : ''} et lancer` : 'Lancer la partie !'}</button>`;
  } else h += `<div class="btn w" style="flex:1;text-align:center;cursor:default">⏳ En attente de l'hôte…</div>`;
  h += `</div>`;
  $('#lobby').innerHTML = h;
  $('#lQuit').onclick = leaveOnline;
  if (host && S) {
    const addBot = s => { const k = s.players.filter(p => p.bot).length; let id = 'bot' + k; while (s.players.some(p => p.id === id)) id += 'x'; s.players.push({ id, name: '🤖 ' + BOTNAMES[k % 8], bot: true, emo: BOTEMO[k % 8], tokens: 0 }); };
    const ab = $('#lAddB'); if (ab) ab.onclick = () => mutate(s => { if (s.players.length < 8) addBot(s); });
    document.querySelectorAll('[data-rmb]').forEach(b => b.onclick = () => mutate(s => { s.players = s.players.filter(p => p.id !== b.dataset.rmb); }));
    bindOpts('#lobby', (r, st) => mutate(s => { s.rounds = r; s.start = st; }));
    $('#lGo').onclick = () => mutate(s => { while (s.players.length < 3) addBot(s); s.code = roomCode; startGame(s); });
  }
}

/* ---- partie ---- */

  // adversaires

    const p = S.players[i], away = !present(p);

      ${cs.k === 'nain' ? DWARF : stack}

    ghost = S.need ? `<div class="card ghost"><b>${RN(S.need)}</b><small>suivante</small></div>` : `<div class="card ghost free"><b>?</b><small>au choix</small></div>`;

    ${S.talon ? `<span class="talon">${S.talon} cartes cachées au talon</span>` : ''}`;
  const last = $('#tapis .card.last'); if (last) last.style.setProperty('--rot', ((S.seq[S.seq.length - 1] * 37) % 15 - 7) + 'deg');
  // statut : ce qui vient de se passer + ce qu'il faut faire
  let st = '', stMe = false;
  if (S.phase === 'play') {
    const t = S.players[S.turn];
    if (S.turn === mi && !veiled) {
      stMe = true;
      st = S.need ? `À toi ! Pose ${UN(S.need)} : touche une carte qui brille` : `À toi ! Pose la carte de ton choix pour lancer une suite`;
    } else if (!present(t)) st = `${t.name} est parti : un bot joue à sa place dans quelques secondes…`;
    else st = S.need ? `Au tour de ${t.name} : il lui faut ${UN(S.need)}` : `Au tour de ${t.name} : il choisit une carte pour lancer une suite`;
  } else if (S.phase === 'roundEnd') st = 'Fin de la manche';

  $('#status').innerHTML = `<div class="say">${esc(narrText(S))}</div><span class="${stMe ? 'me' : ''}">${esc(st)}</span>`;
  // moi

  if (mp) {
    $('#mechip').className = 'mechip' + (S.phase === 'play' && S.turn === mi ? ' turn' : '');

  } else { $('#mechip').innerHTML = '<span class="nm" style="padding:6px">👀 Spectateur</span>'; delete $('#mechip').dataset.p; }
  $('#reacts').innerHTML = mode === 'online' ? ['😂', '🔥', '😱', '👏', '😤', '🧙'].map(e => `<button data-e="${e}" aria-label="Réaction ${e}">${e}</button>`).join('') : '';
  $('#reacts').querySelectorAll('button').forEach(b => b.onclick = () => sendEmo(b.dataset.e));
  // main
  const hand = $('#hand');
  if (!mp) { hand.className = 'hand'; hand.innerHTML = '<div class="msg">Tu regardes la partie. Tu joueras à la prochaine !</div>'; }
  else if (veiled) { hand.className = 'hand'; hand.innerHTML = (S.hands[mi] || []).map(() => '<div class="card back"></div>').join(''); }
  else {
    const h = (S.hands[mi] || []).slice().sort((a, b) => rk(a) - rk(b) || su(a) - su(b));
    const my = S.phase === 'play' && S.turn === mi;
    const ok = my ? new Set(playableOf(S, mi)) : new Set();
    hand.className = 'hand' + (my && ok.size ? ' myturn' : '');
    const help = LS.get('help', true);
    const tipC = (help && my && !S.need && ok.size > 1) ? botPick(S, mi) : -1;
    hand.innerHTML = h.length ? h.map(c => cardHTML(c, (ok.has(c) ? 'ok' : '') + (c === tipC ? ' tip' : ''))).join('') : '<div class="msg">Plus de cartes !</div>';
    hand.querySelectorAll('.card').forEach(el => {
      const c = +el.dataset.c, cs = CASE_OF[c];
      if (cs) el.insertAdjacentHTML('beforeend', `<span class="gain">+${S.pots[cs.k]}</span>`);
      if (c === tipC) { el.insertAdjacentHTML('beforeend', '<span class="tipb">💡</span>'); el.title = 'Conseil : avec cette carte tu peux enchaîner le plus de cartes'; }
    });
    hand.querySelectorAll('.card.ok').forEach(el => el.onclick = () => { const c = +el.dataset.c; captureOrigin(c); SND.pop(); act({ a: 'play', c }); });
  }
  layoutHand();
  renderVeil();
  renderLog();
  renderPhaseModal();
}
function narrText(S) {
  const ev = S.ev, mi = myIdx(); let k = ev.length - 1; if (k < 0) return '';
  const nm = i => i === mi ? 'toi' : pn(S, i);
  let block = null, king = false, passes = [], play = null;
  if (ev[k].k === 'win' || ev[k].k === 'opera' || ev[k].k === 'over') return '';
  if (ev[k].k === 'block') { block = ev[k]; k--; }
  while (k >= 0 && ev[k].k === 'pass') { passes.unshift(ev[k]); k--; }
  if (k >= 0 && ev[k].k === 'king') { king = true; k--; }
  if (k >= 0 && ev[k].k === 'play') play = ev[k];
  else if (k >= 0 && ev[k].k === 'round' && !passes.length && !block) return '🎴 Nouvelle manche : chacun a misé 15 jetons sur le plateau.';
  const out = [];
  let ids = [...new Set(passes.map(e => e.p))];
  const need = passes.length ? RL(passes[0].need) : '';
  if (play) {
    const meP = play.p === mi;
    let t = meP ? `Tu poses ${cname(play.c)}` : `${pn(S, play.p)} pose ${cname(play.c)}`;
    if (play.cs) t += play.amt ? ` et rafle ${play.amt} jetons 💰` : ' (sa case était vide)';
    if (ids[0] === play.p) { t += meP ? ` mais tu n'as pas de ${need}` : ` mais n'a pas de ${need}`; ids = ids.slice(1); }
    out.push(t);
  }
  if (king) out.push('👑 le Roi ferme la suite');
  if (ids.length) {
    const names = ids.map(nm);
    const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' et ' + names[names.length - 1] : names[0];
    const verb = ids.length > 1 ? (ids.includes(mi) ? "n'avez" : "n'ont") : (ids[0] === mi ? "n'as" : "n'a");
    out.push(`${ids.length === 1 && ids[0] === mi ? 'tu' : list} ${verb} pas de ${need}${play && passes[0].p === play.p ? ' non plus' : ''}`);
  }
  if (block) out.push(`personne ne l'a, ${block.p === mi ? 'tu repars' : nm(block.p) + ' repart'} avec la carte de son choix`);
  const t = out.join(' · ');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* ---------------- CONSEILS (première partie) ---------------- */
const TIPS = {
  free: ['Carte au choix', "C'est à toi de lancer une suite : pose n'importe quelle carte. Ensuite, tant que tu as la carte juste au-dessus (par exemple 4 puis 5 puis 6), tu continues. Le 💡 montre la carte qui te permet d'enchaîner le plus."],
  forced: ['Continue la suite', "Regarde le tapis : la carte en pointillés est celle qu'il faut poser, peu importe la couleur. Tes cartes qui brillent en jaune conviennent : touche-en une."],
  pass: ["Tu n'as pas la carte", "Pas grave : ton tour passe tout seul au joueur suivant, qui doit poser cette carte à ta place."],
  block: ['Bloqué !', "Personne n'avait la carte demandée (elle est peut-être cachée au talon). Le dernier à avoir posé une carte recommence avec la carte de son choix."],
  king: ['Le Roi ferme la suite', "Le Roi est la carte la plus haute : impossible d'aller plus loin. Celui qui l'a posé recommence avec la carte de son choix."],
  pot: ['Jackpot ! 💰', "Les cartes ★ (10♦, V♣, D♠, R♥ et le 7♦, le Nain jaune) correspondent aux cases du plateau. Celui qui en pose une rafle tous les jetons de sa case."],
  star: ['Tu as une carte ★', "Le badge jaune indique combien de jetons elle rapporte. Essaie de la poser pendant la manche : si elle te reste en main à la fin, tu paies une pénalité."]
};
let coachQ = [], coachOn = false;
function coach(k) {
  if (!LS.get('help', true) || !TIPS[k]) return;
  const seen = LS.get('seen', {}); if (seen[k] || coachQ.includes(k)) return;
  coachQ.push(k);
  if (!coachOn) { coachOn = true; if (mode !== 'online') clearTimeout(hostTimer); setTimeout(nextCoach, 900); }
}
function nextCoach() {
  const el = $('#coach'), k = coachQ.shift();
  if (!k) { coachOn = false; el.classList.remove('on'); hostTick(); return; }
  const seen = LS.get('seen', {}); seen[k] = 1; LS.set('seen', seen);
  el.innerHTML = `${DWARF}<div style="flex:1"><b>${TIPS[k][0]}</b><p>${TIPS[k][1]}</p><div class="row"><button class="btn w sm" id="coachOff">Plus de conseils</button><button class="btn sm" id="coachOk">Compris !</button></div></div>`;
  el.classList.add('on'); SND.pop();
  $('#coachOk').onclick = nextCoach;
  $('#coachOff').onclick = () => { LS.set('help', false); coachQ = []; nextCoach(); render(); };
}
function checkCoach(newEv) {
  if (!S || veiled) return;
  const mi = myIdx(); if (mi < 0) return;
  newEv.forEach(e => {
    if (e.k === 'pass' && e.p === mi) coach('pass');
    if (e.k === 'block') coach('block');
    if (e.k === 'king') coach('king');
    if (e.k === 'play' && e.cs) coach('pot');
    if (e.k === 'round' && (S.hands[mi] || []).some(c => CASE_OF[c])) coach('star');
  });
  if (S.phase === 'play' && S.turn === mi) coach(S.need ? 'forced' : 'free');
}

function openTuto(i = 0) {
  const sl = tutoSlides(), [t, d, ill] = sl[i], last = i === sl.length - 1;
  openModal(`<h2>${t}</h2><div class="tuto-ill">${ill}</div><p>${d}</p>
    <div class="dots">${sl.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="mbtns">${i ? '<button class="btn w" id="tPrev">← Retour</button>' : '<button class="btn w" id="tSkip">Passer</button>'}
    <button class="btn ${last ? 'g' : ''}" id="tNext">${last ? "C'est compris !" : 'Suivant →'}</button></div>`, 'tuto');
  const done = () => { LS.set('tuto', 1); closeModal(); };
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on('tPrev', () => openTuto(i - 1)); on('tSkip', done);
  on('tNext', () => last ? done() : openTuto(i + 1));
}

function layoutHand() {
  const hand = $('#hand'); if (!hand) return;
  const cards = [...hand.querySelectorAll('.card')]; if (!cards.length) return;
  const W = hand.clientWidth - 8, cw = cards[0].offsetWidth || 60, n = cards.length;
  let ov = 4;
  if (n * (cw + 4) > W) ov = Math.max(-cw * .72, (W - n * cw) / (n - 1));
  cards.forEach((c, i) => c.style.marginLeft = i ? ov + 'px' : '0px');
}

/* ---- fenêtres de fin de manche / de partie ---- */
function renderPhaseModal() {
  if (!S) return;
  const key = S.gid + ':' + S.round + ':' + S.phase;
  if (S.phase === 'play') { if (lastModalKey.endsWith(':roundEnd') || lastModalKey.endsWith(':over')) closeModal(); lastModalKey = key; return; }
  if (key === lastModalKey && $('#modal').classList.contains('on')) { updateModalButtons(); return; }
  if (key === lastModalKey) return;
  lastModalKey = key;
  const delay = S.res && S.res.opera ? 4200 : 1900;
  clearTimeout(renderPhaseModal.t);
  renderPhaseModal.t = setTimeout(() => { if (S && S.gid + ':' + S.round + ':' + S.phase === key) openPhaseModal(); }, delay);
}
function resultTable() {
  const r = S.res; if (!r) return '';
  const w = S.players[r.w];
  let h = `<table class="rtab"><tr><td><div class="who">${avatarHTML(w)}<b>${esc(w.name)}</b></div></td><td class="n" style="color:#17a85c">+${r.gain + r.og} 🪙</td></tr>`;
  r.rows.forEach(x => {
    const p = S.players[x.p];
    h += `<tr><td><div class="who">${avatarHTML(p)}<div><b>${esc(p.name)}</b> <small>${x.cards.length} carte${x.cards.length > 1 ? 's' : ''} restante${x.cards.length > 1 ? 's' : ''} = ${x.cards.reduce((a, c) => a + cval(c), 0)} pts</small><div class="minis">${x.cards.map(c => `<span class="${RED[su(c)] ? 'r' : ''}">${cname(c)}</span>`).join('') || '<span>aucune</span>'}</div></div></div></td>
      <td class="n" style="color:var(--rouge)">−${x.pay}${x.pen ? `<br><small>−${x.pen} pénalité ★</small>` : ''}</td></tr>`;
  });
  return h + '</table>';
}
function openPhaseModal() {
  const host = amHost(), mi = myIdx();
  let h = '';
  if (S.phase === 'roundEnd') {
    const r = S.res, w = S.players[r.w];
    h = `<h2>${r.opera ? '🎭 Grand opéra !' : r.w === mi ? '🏆 Tu gagnes la manche !' : `🏆 ${esc(w.name)} gagne la manche`}</h2>
      <p>${r.opera ? `${esc(w.name)} a posé toutes ses cartes d'un coup et rafle tout le plateau (+${r.og}).` : 'Les autres paient la valeur des cartes qui leur restent. Une carte du plateau gardée en main coûte le double de sa mise.'}</p>
      ${resultTable()}${rankingHTML()}<div class="mbtns" id="mb"></div>`;
  } else if (S.phase === 'over') {
    const rank = S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.tokens - a.p.tokens);
    const top = rank.slice(0, 3), ord = top.length === 3 ? [top[1], top[0], top[2]] : top.length === 2 ? [top[1], top[0]] : top;
    const iWon = S.fin.win.includes(mi);
    h = `<h2>${iWon ? '👑 Victoire !' : '🏁 Fin de la partie'}</h2>
      ${S.fin.ruined.length ? `<p>💸 ${esc(S.fin.ruined.join(', '))} ${S.fin.ruined.length > 1 ? 'sont ruinés' : 'est ruiné'} : la partie s'arrête là.</p>` : ''}
      ${S.res ? resultTable() : ''}
      <div class="podium">${ord.map(x => { const pos = rank.indexOf(x) + 1; return `<div class="pod p${pos}">${pos === 1 ? '<span class="crown">👑</span>' : ''}${avatarHTML(x.p)}<span class="nm">${esc(x.p.name)}</span>
        <div class="blk" style="height:${pos === 1 ? 92 : pos === 2 ? 66 : 48}px">${pos}</div><span style="font-size:13px">${x.p.tokens} 🪙</span></div>`; }).join('')}</div>
      ${rank.length > 3 ? `<p style="font-size:14px">${rank.slice(3).map((x, k) => `${k + 4}. ${esc(x.p.name)} (${x.p.tokens})`).join(' · ')}</p>` : ''}
      <div class="mbtns" id="mb"></div>`;
  } else return;
  openModal(h, 'phase');
  updateModalButtons();
}
function rankingHTML() {
  const rank = S.players.slice().sort((a, b) => b.tokens - a.tokens);
  return `<p style="margin-top:12px;font-size:14px"><b>Classement :</b> ${rank.map((p, k) => `${k + 1}. ${esc(p.name)} ${p.tokens}🪙`).join(' · ')}</p>`;
}
function updateModalButtons() {
  const mb = $('#mb'); if (!mb) return;
  const host = amHost();
  let h = '';
  if (S.phase === 'roundEnd') {
    if (host) h = `<button class="btn g" id="bNext">Manche suivante (${S.round + 1}/${S.rounds})</button>`;
    else h = `<p class="muted">L'hôte va lancer la manche suivante…</p>`;
    h += `<button class="btn w" id="bClose">Voir le plateau</button>`;
  } else if (S.phase === 'over') {
    if (host) h = `<button class="btn g" id="bRe">🔁 Revanche</button>` + (mode === 'online' ? `<button class="btn w" id="bLob">Retour au salon</button>` : `<button class="btn w" id="bMenu">Menu</button>`);
    else h = `<p class="muted">L'hôte peut lancer une revanche.</p><button class="btn w" id="bQuit">Quitter</button>`;
  }
  mb.innerHTML = h;
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('bNext', () => { closeModal(); act({ a: 'next' }); });
  on('bClose', () => { closeModal(); showReopen(); });
  on('bRe', () => { closeModal(); act({ a: 'rematch' }); });
  on('bLob', () => { closeModal(); act({ a: 'lobby' }); });
  on('bMenu', () => { closeModal(); quitGame(); });
  on('bQuit', () => { closeModal(); quitGame(); });
}
function showReopen() {
  $('#status').innerHTML = `<button class="btn sm" id="reopen">Voir les résultats de la manche</button>`;
  $('#reopen').onclick = () => openPhaseModal();
}
let modalKind = '';
function openModal(h, kind = 'info') { modalKind = kind; $('#modalBody').innerHTML = h; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); modalKind = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !(S && (S.phase === 'roundEnd' || S.phase === 'over') && $('#mb'))) closeModal(); });

/* ---------------- ANIMATIONS D'ÉVÉNEMENTS ---------------- */
let clickOrigin = null;
function captureOrigin(c) { const el = document.querySelector(`#hand .card[data-c="${c}"]`); clickOrigin = el ? { c, r: el.getBoundingClientRect() } : null; }
function originRect(prev, p, c) {
  if (clickOrigin && clickOrigin.c === c) { const r = clickOrigin.r; clickOrigin = null; return r; }
  if (prev && p === myIdxFor(prev)) { const el = document.querySelector(`#hand .card[data-c="${c}"]`); if (el) return el.getBoundingClientRect(); }
  const ch = playerEl(p); return ch ? ch.getBoundingClientRect() : null;
}
function myIdxFor(st) { if (mode === 'online') return st.players.findIndex(p => p.id === myId); return viewIdx; }
function playerEl(p) { return document.querySelector(`.opp[data-p="${p}"]`) || ($('#mechip').dataset.p == String(p) ? $('#mechip') : null); }
function bubble(p, txt) {
  const el = playerEl(p); if (!el) return;
  el.querySelectorAll('.bubble').forEach(b => b.remove());
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = txt; el.appendChild(b); setTimeout(() => b.remove(), 1700);
}
function runEvents(list, origins, prev) {
  if (!list.length) return;
  const many = list.filter(e => e.k === 'play').length > 2;
  let t = 0;
  list.forEach(e => { setTimeout(() => runEvent(e, origins[e.n], many), t); t += many ? 60 : (e.k === 'pass' ? 420 : e.k === 'play' ? 300 : 160); });
}
function runEvent(e, origin, quick) {
  const P = S.players[e.p];
  switch (e.k) {
    case 'play': {
      const target = $('#tapis .card.last');
      if (origin && target && !quick && !RM && Number(target.dataset.c) === e.c) {
        const tr = target.getBoundingClientRect();
        const f = document.createElement('div'); f.innerHTML = cardHTML(e.c, 'fly'); const fe = f.firstChild;
        const sx = origin.left + origin.width / 2 - tr.width / 2, sy = origin.top + origin.height / 2 - tr.height / 2;
        fe.style.width = tr.width + 'px'; fe.style.height = tr.height + 'px';
        fe.style.transform = `translate(${sx}px,${sy}px) rotate(-20deg) scale(.8)`;
        document.body.appendChild(fe); target.classList.add('hidden');
        requestAnimationFrame(() => requestAnimationFrame(() => { fe.style.transform = `translate(${tr.left}px,${tr.top}px) rotate(${getComputedStyle(target).getPropertyValue('--rot') || '0deg'}) scale(1.06)`; }));
        setTimeout(() => { fe.remove(); target.classList.remove('hidden'); target.classList.add('land'); SND.card(); afterLand(e, P); }, 430);
      } else { SND.card(); afterLand(e, P); }
      break;
    }
    case 'pass': bubble(e.p, `Pas de ${RL(e.need)} !`); SND.pass(); break;
    case 'block': stamp(`Bloqué !<small>Personne n'a de ${esc(RL(e.need))}</small>`); SND.block(); setTimeout(() => bubble(e.p, 'Je repars !'), 700); break;
    case 'king': setTimeout(() => { bubble(e.p, '👑 Le roi ferme la suite !'); SND.king(); }, 450); break;
    case 'round': roundFx(); break;
    case 'win': winFx(e); break;
    case 'opera': operaFx(e); break;
    case 'over': setTimeout(() => { fireworks(8); SND.over(); confettiRain(200); }, 1300); break;
  }
}
function afterLand(e, P) {
  const tgt = $('#tapis .card.last');
  if (tgt && !RM) { const c = centerOf(tgt); burst(c.x, c.y, { n: e.cs ? 40 : 10, spd: e.cs ? 8 : 4, life: 40, sz: 6, colors: ['#fff', '#ffd426'] }); }
  if (e.st >= 4 && !e.cs) {
    const c = tgt ? centerOf(tgt) : { x: innerWidth / 2, y: innerHeight / 2 };
    const d = document.createElement('div'); d.className = 'combo'; d.textContent = `Combo ×${e.st} !`; d.style.left = c.x + 'px'; d.style.top = (c.y - 70) + 'px';
    document.body.appendChild(d); setTimeout(() => d.remove(), 1150); SND.combo(e.st);
    if (e.st >= 6) shake();
  }
  if (!e.cs) return;
  const caseEl = document.querySelector(`.case[data-k="${e.cs}"]`), pEl = playerEl(e.p);
  if (caseEl) { caseEl.classList.remove('flash'); void caseEl.offsetWidth; caseEl.classList.add('flash'); }
  const go = () => { if (caseEl && pEl && e.amt > 0) coinsFly(centerOf(caseEl), centerOf(pEl), e.amt, () => { const c = centerOf(pEl); floatText(c.x, c.y - 20, '+' + e.amt); SND.coin(); }); else if (pEl) { const c = centerOf(pEl); floatText(c.x, c.y - 20, 'Case vide !', 'red'); } };
  if (e.cs === 'nain') {
    flash('#ffd426'); shake(); SND.nain();
    $('#banner').innerHTML = `<div class="nainshow">${DWARF}<div class="bn big" style="animation:none">Nain jaune !<small>${esc(P.name)} rafle ${e.amt} jetons</small></div></div>`;
    clearTimeout(banner.t); banner.t = setTimeout(() => $('#banner').innerHTML = '', 2600);
    confettiRain(160, ['#ffd426', '#ffb800', '#fff', '#12102b']);
    setTimeout(() => { const c = caseEl ? centerOf(caseEl) : { x: innerWidth / 2, y: innerHeight / 2 }; burst(c.x, c.y, { n: 90, spd: 12, sz: 10, colors: ['#ffd426', '#fff', '#ffb800'] }); }, 300);
    setTimeout(go, 900);
  } else {
    SND.coin();
    const cs = CASE_K[e.cs];
    banner(`${esc(cs.nom)} !<small>${esc(P.name)} +${e.amt}</small>`, e.cs === 'roi' ? 'red' : '', 1400);
    if (caseEl) { const c = centerOf(caseEl); burst(c.x, c.y, { n: 45, spd: 9, sz: 8, colors: ['#ffd426', '#fff', '#2bd47d'] }); }
    go();
  }
}
function roundFx() {
  SND.deal();
  if (S.round > 0) banner(`Manche ${S.round}<small>Mises posées, cartes distribuées !</small>`, 'green', 1500);
  const from = centerOf($('#tapis'));
  const targets = [...document.querySelectorAll('.opp'), $('#mechip')].filter(Boolean);
  if (RM) return;
  targets.forEach((t, k) => {
    for (let j = 0; j < 3; j++) setTimeout(() => {
      const to = centerOf(t); const d = document.createElement('div'); d.className = 'card back fly';
      d.style.width = '34px'; d.style.height = '48px'; d.style.transform = `translate(${from.x - 17}px,${from.y - 24}px)`; document.body.appendChild(d);
      requestAnimationFrame(() => requestAnimationFrame(() => d.style.transform = `translate(${to.x - 17}px,${to.y - 24}px) rotate(${(Math.random() - .5) * 60}deg) scale(.6)`));
      setTimeout(() => d.remove(), 460);
    }, (j * targets.length + k) * 45);
  });
  // les mises volent vers le plateau
  setTimeout(() => CASES.forEach(cs => { const ce = document.querySelector(`.case[data-k="${cs.k}"]`); if (!ce) return; targets.forEach(t => coinsFly(centerOf(t), centerOf(ce), 1)); }), 500);
}
function winFx(e) {
  const P = S.players[e.p], mine = e.p === myIdx();
  setTimeout(() => {
    SND.win(); confettiRain(mine ? 220 : 120); if (mine) { flash('#2bd47d'); fireworks(3); }
    banner(`${mine ? 'Tu gagnes !' : esc(P.name) + ' gagne !'}<small>+${e.gain} jetons</small>`, 'big', 2000);
    const pEl = playerEl(e.p);
    if (pEl) S.res.rows.forEach(r => { const o = playerEl(r.p); if (o && r.pay) coinsFly(centerOf(o), centerOf(pEl), r.pay); });
  }, 500);
}
function operaFx(e) {
  const P = S.players[e.p];
  setTimeout(() => {
    $('#dim').classList.add('on'); SND.opera();
    const word = 'GRAND OPÉRA';
    $('#banner').innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${DWARF.replace('class="dwarf"', 'class="dwarf" style="width:120px;height:140px;animation:dance .3s infinite alternate;filter:drop-shadow(0 0 20px #ffd426)"')}
      <div class="opera">${[...word].map((ch, i) => `<span style="animation-delay:${i * .09}s">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')}</div>
      <div class="bn" style="font-size:clamp(22px,6vw,40px);animation:none">${esc(P.name)} rafle tout le plateau !</div></div>`;
    clearTimeout(banner.t);
    setTimeout(() => { shake(); flash('#ffd426'); fireworks(10); confettiRain(260, ['#ffd426', '#fff', '#ffb800', '#ff7ac8']); }, 1300);
    const pEl = playerEl(e.p);
    setTimeout(() => { document.querySelectorAll('.case').forEach(ce => pEl && coinsFly(centerOf(ce), centerOf(pEl), 8)); }, 1800);
    banner.t = setTimeout(() => { $('#banner').innerHTML = ''; $('#dim').classList.remove('on'); }, 4000);
  }, 450);
}

/* ---------------- RÉACTIONS ---------------- */
function sendEmo(e) {
  const now = Date.now(); if (now - lastReact < 700) return; lastReact = now;
  showEmo(myId, e); if (room) room.send({ t: 'emo', e });
}
function showEmo(pid, e) {
  if (!S) return;
  const i = S.players.findIndex(p => p.id === pid); const el = i >= 0 ? playerEl(i) : null; if (!el) return;
  const c = centerOf(el); const d = document.createElement('div'); d.className = 'emo'; d.textContent = e; d.style.left = c.x + 'px'; d.style.top = (c.y - 10) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1900); SND.pop();
}

/* ---------------- DIVERS ---------------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
function quitGame() {
  if (mode === 'online') return leaveOnline();
  if (S && S.phase === 'over') LS.del('local');
  mode = null; S = null; veiled = false; clearTimeout(hostTimer); closeModal(); $('#veil').classList.remove('on'); render();
}
function rulesHTML() {
  return `<h2>📜 Les règles</h2>
  <p><b>Le but :</b> être le premier à vider sa main, et rafler les jetons posés sur le plateau.</p>
  <p><b>Le plateau</b> a cinq cases, chacune liée à une carte : le 10♦ (mise 1), le valet ♣ (2), la dame ♠ (3), le roi ♥ (4) et le 7♦, le fameux <b>Nain jaune</b> (5). Au début de chaque manche, chacun dépose ces mises, soit 15 jetons.</p>
  <ul>
    <li>Le premier joueur pose la carte de son choix, puis enchaîne en montant de 1 en 1 sans regarder la couleur (5, 6, 7…) tant qu'il peut.</li>
    <li>Quand il bloque, le joueur suivant doit continuer la suite. Celui qui n'a pas la carte demandée passe.</li>
    <li>Si personne n'a la carte, ou après un <b>roi</b>, le dernier à avoir posé repart avec la carte de son choix.</li>
    <li>Poser une carte du plateau, c'est rafler tous les jetons de sa case. Les cases non gagnées se cumulent d'une manche à l'autre.</li>
    <li>Le premier sans carte gagne la manche. Les autres lui paient la valeur des cartes qui leur restent (as = 1, figures = 10).</li>
    <li>Garder une carte du plateau en main à la fin coûte le double de sa mise, versé dans sa case.</li>
    <li><b>Grand opéra :</b> celui qui pose toutes ses cartes sans que personne d'autre ne joue rafle tout le plateau !</li>
  </ul>
  <p>Distribution : 15 cartes à 3, 12 à 4, 9 à 5, 8 à 6, 7 à 7, 6 à 8. Le reste dort au talon, et ces cartes peuvent bloquer les suites.</p>
  <p>La partie se joue en un nombre de manches choisi. Celui qui a le plus de jetons à la fin gagne. Si quelqu'un est ruiné, la partie s'arrête tout de suite.</p>
  <div class="mbtns"><button class="btn" onclick="closeModal()">Compris !</button></div>`;
}
function settingsHTML() {
  return `<h2>☰ Menu</h2>
    <label class="toggle">Son<input type="checkbox" id="tSnd" ${SND.on ? 'checked' : ''}></label>
    <label class="toggle">Conseils et carte suggérée 💡<input type="checkbox" id="tHelp" ${LS.get('help', true) ? 'checked' : ''}></label>
    <label class="toggle">Jouer automatiquement quand je n'ai qu'un seul choix<input type="checkbox" id="tAuto" ${LS.get('auto', false) ? 'checked' : ''}></label>
    <div class="mbtns"><button class="btn w" id="sTuto">❓ Comment jouer</button><button class="btn w" id="sRules">📜 Règles</button></div>
    <div class="mbtns"><button class="btn p" id="sQuit">${mode === 'online' ? 'Quitter la salle' : 'Quitter (sauvegardé)'}</button></div>
    <div class="mbtns"><button class="btn" onclick="closeModal()">Reprendre</button></div>`;
}
$('#btnRules').onclick = () => openModal(rulesHTML());
$('#btnTuto').onclick = () => openTuto(0);
$('#btnSnd1').onclick = $('#btnSnd2').onclick = () => setSnd(!SND.on);
$('#btnLog').onclick = () => $('#log').classList.toggle('on');
$('#logClose').onclick = () => $('#log').classList.remove('on');
$('#btnMenu').onclick = () => {
  openModal(settingsHTML());
  $('#tSnd').onchange = e => setSnd(e.target.checked);
  $('#tAuto').onchange = e => { LS.set('auto', e.target.checked); autoForced(); };
  $('#sRules').onclick = () => openModal(rulesHTML());
  $('#sTuto').onclick = () => openTuto(0);
  $('#tHelp').onchange = e => { LS.set('help', e.target.checked); if (e.target.checked) LS.set('seen', {}); render(); };
  $('#sQuit').onclick = () => { closeModal(); quitGame(); };
};
setSnd(SND.on);

/* ---------------- DÉMARRAGE ---------------- */
(async function boot() {
  if (SDK) {
    try { const m = await SDK.me(); if (m) { me.name = m.name || me.name; me.avatar = m.avatar || null; me.id = m.id; } } catch (e) {}
    const inv = SDK.room ? SDK.room() : null;
    if (inv) { joinRoom(String(inv).toUpperCase(), true); if (!LS.get('tuto', 0)) setTimeout(() => openTuto(0), 400); return; }
  }
  render();
  if (!LS.get('tuto', 0)) setTimeout(() => openTuto(0), 400);
})();
</script>
